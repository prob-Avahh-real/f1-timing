disabled_rules:
  - trailing_whitespace
  - comment_spacing
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - optional_enum_case_matching
analyzer_rules:
  - unused_import
included:
  - App
  - Features
  - Models
  - Services
  - Shared
  - LiveActivity
  - Widget
line_length:
  warning: 120
  error: 150
file_length:
  warning: 400
  error: 600
type_body_length:
  warning: 300
  error: 500
