name: F1Timing
options:
  bundleIdPrefix: com.f1timing
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_CFBundleDisplayName: "F1 Timing"
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    INFOPLIST_KEY_UILaunchStoryboardName: ""
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  F1Timing:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Features
      - path: Services
      - path: Models
      - path: Shared
      - path: Resources
        type: folder
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: F1Widget
      - target: F1LiveActivity
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.f1timing.app
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"

  F1Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Models
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.f1timing.app.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  F1LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Models
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: LiveActivity/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.f1timing.app.live-activity
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_UIBackgroundModes:
          - fetch
          - processing
